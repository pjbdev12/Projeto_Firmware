; ─────────────────────────────────────────────────────────────────────────
; Etapa 1 — Os sensores: dois barramentos, seis grandezas
;
; Tres ambientes de compilação:
;
;   esp32doit-devkit-v1   o firmware de verdade, na placa      (padrão)
;   scanner               a ferramenta de diagnostico I2C
;   native                o MESMO firmware e os testes, no PC  (padrão)
;   experimento           a bancada de medicao da media movel
;
; O ambiente native compila os seus arquivos de src/ sem alteração nenhuma:
; o que ele troca sao as BIBLIOTECAS dos sensores, por versoes falsas em
; src/sim/. Por isso  pio test  vale como verificacao do codigo que vai
; para a placa, e nao de uma copia paralela dele.
; ─────────────────────────────────────────────────────────────────────────

[platformio]
; Sem isto, um  pio run  sozinho tentaria compilar TODOS os ambientes,
; inclusive os testes do PC. O padrão é o firmware.
default_envs = esp32doit-devkit-v1, native


[env:esp32doit-devkit-v1]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; Os testes de test/ são de lógica pura e rodam no PC (env:native).
; Sem esta linha, um  pio test  sem -e tentaria roda-los TAMBEM na placa:
; lá o main.cpp não entra na compilação do teste, e o link falha
; procurando setup() e loop(). O ambiente que roda teste é um só.
test_ignore = *

lib_deps =
    dfrobot/DFRobot_ENS160@^1.0.1     ; eCO2, TVOC e AQI          — I2C
    adafruit/Adafruit AHTX0@^2.0.5    ; temperatura e umidade     — I2C
    fu-hsi/PMS Library@^1.1.0         ; PM1.0, PM2.5 e PM10       — UART

; O scanner é uma ferramenta auxiliar e os simulados são o outro firmware:
; nenhum dos dois entra na compilação normal.
build_src_filter = +<*> -<scanner_i2c.cpp> -<sim/>


; ── Ferramenta auxiliar: scanner do barramento I2C ───────────────────────
; Grava SÓ o scanner, sem apagar nem alterar o seu main.cpp:
;
;     pio run -e scanner -t upload -t monitor
;
; Depois, para voltar ao firmware normal:
;
;     pio run -t upload -t monitor
;
[env:scanner]
extends          = env:esp32doit-devkit-v1
build_src_filter = -<*> +<scanner_i2c.cpp>


; ── Os testes e o firmware rodando no PC ─────────────────────────────────
;
;     pio test              roda os testes (o botão Test do VS Code)
;     pio run -e native -t exec    roda o firmware no seu computador
;
; O truque está em duas linhas de build_flags: -I aponta para os
; cabeçalhos falsos, e lib_deps NÃO traz as bibliotecas dos sensores I2C.
; Então  #include <Adafruit_AHTX0.h>  resolve para o falso, e o SEU
; sensor_amb.cpp compila sem alteração nenhuma.
;
; A biblioteca do PMS5003 continua sendo a REAL: ela só precisa de um
; Stream, e o Stream falso entrega os mesmos bytes que o sensor entregaria.
; O parser sob teste é o mesmo que roda na placa.
;
[env:native]
platform       = native
test_framework = unity
test_build_src = yes

build_flags =
    -std=gnu++17 -Wall
    -DSIM_HOST
    -I src/sim/host
    -I src/sim/falsas

build_src_filter = +<*> -<scanner_i2c.cpp>

; A biblioteca do PMS declara ser de placas Arduino, e o PlatformIO a
; descartaria no ambiente native. Ela na verdade só usa Stream e millis(),
; então a compatibilidade é desligada de propósito.
lib_compat_mode = off
lib_deps =
    fu-hsi/PMS Library@^1.1.0


; ── A bancada de medicao da media movel ──────────────────────────────────
;
;     pio run -e experimento -t exec
;
; O ambiente native mostra o firmware rodando em tempo real, o que serve
; para VER. Este serve para MEDIR: submete a media movel a dois ensaios
; controlados — ambiente parado e degrau — e imprime numeros. O tempo e
; simulado, entao tres minutos de ensaio passam num piscar.
;
; A unica diferenca em relacao ao native e qual main() entra: o de
; src/sim/host_main.cpp (tempo real) ou o de src/sim/host_experimento.cpp
; (medicao). O SEU codigo e o mesmo nos dois.
;
[env:experimento]
extends          = env:native
build_flags      = ${env:native.build_flags} -DSIM_EXPERIMENTO
build_src_filter = +<*> -<scanner_i2c.cpp> -<sim/host_main.cpp>
test_ignore      = *
